services:
  partners:
    build: .
    command: ["plexis", "partners"]
    environment:
      PLEXIS_HOST: 0.0.0.0
      PLEXIS_PARTNERS_PORT: "9100"
    ports: ["9100:9100"]
  plexis:
    build: .
    depends_on: [partners]
    environment:
      PLEXIS_HOST: 0.0.0.0
      PLEXIS_DEV_MODE: "true"
      PLEXIS_PARTNERS_URL: http://partners:9100
      PLEXIS_ALLOWED_ORIGINS: http://localhost:5173
      # Optional: Amazon Bedrock (Nova) parsing + phrasing, Bedrock Guardrails, S3 ledger backups
      PLEXIS_LLM: ${PLEXIS_LLM:-off}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      PLEXIS_GUARDRAIL_ID: ${PLEXIS_GUARDRAIL_ID:-}
      PLEXIS_BACKUP_S3_BUCKET: ${PLEXIS_BACKUP_S3_BUCKET:-}
    ports: ["8000:8000"]
    volumes: ["plexis-state:/app/var"]
volumes:
  plexis-state: {}

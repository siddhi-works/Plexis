[project]
name = "qed"
version = "0.1.0"
description = "QED: an intent compiler for Alexa+. Turns spoken requests into plans that come with a machine-checkable proof."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Plexis contributors" }]
dependencies = [
  "mcp>=1.23,<2.2",
  "ortools>=9.15",
  "z3-solver>=4.13",
  "pydantic>=2.8",
  "httpx>=0.27",
  "starlette>=0.40",
  "uvicorn>=0.30",
  "structlog>=24.0",
  "opentelemetry-api>=1.27",
  "opentelemetry-sdk>=1.27",
  "prometheus-client>=0.20",
  "cryptography>=43",
  "orjson>=3.10",
  "pyjwt>=2.9",
  "boto3>=1.35",
  "strands-agents>=1.0",
  "langgraph>=1.2",
]

[project.optional-dependencies]
voice = ["sounddevice>=0.5", "faster-whisper>=1.0", "pyttsx3>=2.90", "numpy>=1.26"]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "hypothesis>=6.100",
  "jsonschema>=4.23",
  "ruff>=0.6",
  "mypy>=1.11",
  "bandit>=1.7",
]

[project.scripts]
qed = "qed.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "slow: long-running tests (benchmarks, load)",
  "chaos: fault-injection tests",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101", "E501", "RUF001", "RUF002", "RUF003", "SIM105"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]
"src/qed/eval/**" = ["S311"]
"scripts/**" = ["S", "T20"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = true

[tool.coverage.run]
source = ["src/qed"]
branch = true
